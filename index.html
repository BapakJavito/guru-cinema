<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guru Cinema — Now Showing</title>
<style>
  @font-face {
    font-family: 'Sneakers Max 500';
    src: url('assets/fonts/SneakersMax500-Regular.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
  }

  @font-face {
    font-family: 'Sneakers Max 500';
    src: url('assets/fonts/SneakersMax500-Bold.otf') format('opentype');
    font-weight: bold;
    font-style: normal;
  }

  @font-face {
    font-family: 'Sneakers Max 500';
    src: url('assets/fonts/SneakersMax500-Oblique.otf') format('opentype');
    font-weight: normal;
    font-style: oblique;
  }

  @font-face {
    font-family: 'Billy';
    src: url('assets/fonts/billy.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Arial Narrow', Arial, sans-serif;
    background: #FFFFFF;
    color: #2A2320;
    display: flex;
    justify-content: center;
  }

  .screen {
    width: 100%;
    max-width: 420px;
    padding: 32px 20px 60px;
    text-align: center;
  }

  .logo {
    width: 244px;
    max-width: 76%;
    margin: 0 auto 30px;
    display: block;
  }

  h1.month-title {
    font-family: 'Sneakers Max 500', 'Arial Black', sans-serif;
    font-weight: normal;
    font-style: normal;
    font-size: 18px;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
  }

  .tagline {
    font-size: 13px;
    color: #6B655C;
    line-height: 1.6;
    margin-bottom: 32px;
    padding: 0 8px;
  }

  .tagline strong {
    color: #2A2320;
  }

  .month-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 28px;
  }

  .month-nav button {
    width: 32px;
    height: 32px;
    border: none;
    background: #F2F0EC;
    color: #E8442A;
    font-size: 16px;
    font-weight: 700;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .month-nav button:disabled {
    color: #C9C5BE;
    cursor: not-allowed;
  }

  .month-nav span {
    font-family: 'Sneakers Max 500', 'Arial Black', sans-serif;
    font-weight: normal;
    font-style: normal;
    font-size: 16px;
    letter-spacing: 2px;
    min-width: 96px;
  }

  .week {
    display: flex;
    flex-direction: column;
    text-align: center;
  }

  .screening {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 29px 0;
  }

  .poster {
    width: 204px;
    height: 277px;
    background: #F2F0EC;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 15px;
    color: #B5B0A8;
    font-size: 41px;
    overflow: hidden;
    box-shadow: 0 11px 28px rgba(42, 35, 32, 0.20);
  }

  .poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .day-tag {
    display: flex;
    align-items: baseline;
    gap: 9px;
    font-family: 'Billy', 'Arial Black', sans-serif;
    font-size: 25px;
    color: #E8442A;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 11px;
  }

  .day-num {
    font-size: 25px;
    letter-spacing: 0;
    text-transform: none;
  }

  .film-title {
    font-weight: 700;
    font-size: 22px;
    color: #2A2320;
    margin-bottom: 6px;
  }

  .film-meta {
    font-size: 18px;
    color: #8A8580;
    margin-bottom: 9px;
  }

  .trailer-link {
    display: inline-block;
    font-size: 18px;
    font-weight: 400;
    color: #8A8580;
    text-decoration: none;
  }

  .trailer-link:hover {
    text-decoration: underline;
  }

  .empty-month {
    font-size: 13px;
    color: #8A8580;
    padding: 40px 0;
  }

  .popcorn-intro {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 999;
  }

  .popcorn-piece {
    position: absolute;
    top: -12vh;
    width: 44px;
    opacity: 0;
    animation-name: popcornFall;
    animation-timing-function: ease-in;
    animation-fill-mode: forwards;
  }

  .popcorn-piece img {
    width: 100%;
    height: auto;
    display: block;
  }

  @keyframes popcornFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    85% { opacity: 1; }
    100% { transform: translateY(128vh) rotate(50deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="popcorn-intro" id="popcornIntro"></div>

<div class="screen">

  <img class="logo" src="assets/logo.png" alt="Guru Cinema">

  <h1 class="month-title">UPCOMING PROJECTIONS</h1>

  <p class="tagline">Every Sunday and Wednesday at Guru — <strong>Sundays</strong> family friendly, <strong>Wednesdays</strong> for real cinema lovers.</p>

  <div class="month-nav">
    <button id="prevMonth" aria-label="Previous month">‹</button>
    <span id="monthLabel">JULY</span>
    <button id="nextMonth" aria-label="Next month">›</button>
  </div>

  <div class="week" id="filmList"></div>

</div>

<script>
  var films = [
    {date:'2026-07-19', day:'sun', title:'E.T. the Extra-Terrestrial', duration:115, genre:'Sci-Fi', trailer:'https://www.youtube.com/watch?v=DSx8Jobx-Gs', slug:'et-the-extra-terrestrial'},
    {date:'2026-07-22', day:'wed', title:'Ad Astra', duration:123, genre:'Sci-Fi', trailer:'https://www.youtube.com/watch?v=P6AaSMfXHbA', slug:'ad-astra'},
    {date:'2026-07-26', day:'sun', title:'Ocean\'s Eleven', duration:116, genre:'Crime', trailer:'https://www.youtube.com/watch?v=mG0Xr7wcO8g', slug:'oceans-eleven'},
    {date:'2026-07-29', day:'wed', title:'Life of Brian', duration:94, genre:'Comedy', trailer:'https://www.youtube.com/watch?v=GeKzBQnAq5I', slug:'life-of-brian'},
    {date:'2026-08-02', day:'sun', title:'The Goonies', duration:114, genre:'Adventure', trailer:'https://www.youtube.com/watch?v=lYLAGAwcpSQ', slug:'the-goonies'},
    {date:'2026-08-05', day:'wed', title:'Cinema Paradiso', duration:124, genre:'Drama', vo:true, trailer:'https://www.youtube.com/watch?v=JMyVSD6OvO8', slug:'cinema-paradiso'},
    {date:'2026-08-09', day:'sun', title:'Finding Nemo', duration:100, genre:'Animation', trailer:'https://www.youtube.com/watch?v=h2qasTcpQv4', slug:'finding-nemo'},
    {date:'2026-08-12', day:'wed', title:'The Grand Budapest Hotel', duration:99, genre:'Comedy', trailer:'https://www.youtube.com/watch?v=1Fg5iWmQjwk', slug:'the-grand-budapest-hotel'},
    {date:'2026-08-16', day:'sun', title:'Jaws', duration:124, genre:'Thriller', trailer:'https://www.youtube.com/watch?v=j81szeqFku4', slug:'jaws'},
    {date:'2026-08-19', day:'wed', title:'Moonrise Kingdom', duration:94, genre:'Comedy', trailer:'https://www.youtube.com/watch?v=7N8wkVA4_8s', slug:'moonrise-kingdom'},
    {date:'2026-08-23', day:'sun', title:'Pirates of the Caribbean: The Curse of the Black Pearl', duration:143, genre:'Adventure', trailer:'https://www.youtube.com/watch?v=naQr0uTrH_s', slug:'pirates-of-the-caribbean-the-curse-of-the-black-pearl'},
    {date:'2026-08-26', day:'wed', title:'Little Miss Sunshine', duration:101, genre:'Comedy', trailer:'https://www.youtube.com/watch?v=bQ7BZTMLImA', slug:'little-miss-sunshine'},
    {date:'2026-08-30', day:'sun', title:'Jumanji', duration:104, genre:'Adventure', trailer:'https://www.youtube.com/watch?v=eTjDsENDZ6s', slug:'jumanji'},
    {date:'2026-09-02', day:'wed', title:'Dead Poets Society', duration:128, genre:'Drama', trailer:'https://www.youtube.com/watch?v=ye4KFyWu2do', slug:'dead-poets-society'},
    {date:'2026-09-06', day:'sun', title:'School of Rock', duration:108, genre:'Comedy', trailer:'https://www.youtube.com/watch?v=TExoc0MG4I4', slug:'school-of-rock'},
    {date:'2026-09-09', day:'wed', title:'Captain Fantastic', duration:118, genre:'Drama', trailer:'https://www.youtube.com/watch?v=Ty9Uz9s5Z8I', slug:'captain-fantastic'},
    {date:'2026-09-13', day:'sun', title:'Matilda', duration:102, genre:'Family', trailer:'https://www.youtube.com/watch?v=GKhOM7Ns6do', slug:'matilda'},
    {date:'2026-09-16', day:'wed', title:'Into the Wild', duration:148, genre:'Drama', trailer:'https://www.youtube.com/watch?v=LVO0N2XgfZg', slug:'into-the-wild'},
    {date:'2026-09-20', day:'sun', title:'The Karate Kid', duration:126, genre:'Drama', trailer:'https://www.youtube.com/watch?v=xlnm0NtPoVs', slug:'the-karate-kid'},
    {date:'2026-09-23', day:'wed', title:'Lost in Translation', duration:102, genre:'Drama', trailer:'https://www.youtube.com/watch?v=W6iVPCRflQM', slug:'lost-in-translation'},
    {date:'2026-09-27', day:'sun', title:'Ratatouille', duration:111, genre:'Animation', trailer:'https://www.youtube.com/watch?v=NgsQ8mVkN8w', slug:'ratatouille'},
    {date:'2026-09-30', day:'wed', title:'In the Mood for Love', duration:98, genre:'Romance', vo:true, trailer:'https://www.youtube.com/watch?v=m8GuedsQnWQ', slug:'in-the-mood-for-love'},
    {date:'2026-10-04', day:'sun', title:'Up', duration:96, genre:'Animation', trailer:'https://www.youtube.com/watch?v=qas5lWp7_R0', slug:'up'},
    {date:'2026-10-07', day:'wed', title:'Past Lives', duration:105, genre:'Romance', trailer:'https://www.youtube.com/watch?v=kA244xewjcI', slug:'past-lives'},
    {date:'2026-10-11', day:'sun', title:'Ghostbusters', duration:105, genre:'Comedy', trailer:'https://www.youtube.com/watch?v=6hDkhw5Wkas', slug:'ghostbusters'},
    {date:'2026-10-14', day:'wed', title:'Blade Runner', duration:117, genre:'Sci-Fi', trailer:'https://www.youtube.com/watch?v=eogpIG53Cis', slug:'blade-runner'},
    {date:'2026-10-18', day:'sun', title:'Edward Scissorhands', duration:105, genre:'Fantasy', trailer:'https://www.youtube.com/watch?v=tSzo2O1s7Zo', slug:'edward-scissorhands'},
    {date:'2026-10-21', day:'wed', title:'Parasite', duration:132, genre:'Thriller', vo:true, trailer:'https://www.youtube.com/watch?v=5xH0HfJHsaY', slug:'parasite'},
    {date:'2026-10-25', day:'sun', title:'Corpse Bride', duration:77, genre:'Animation', trailer:'https://www.youtube.com/watch?v=MZI4q8CRvcA', slug:'corpse-bride'},
    {date:'2026-10-28', day:'wed', title:'Ghost Dog: The Way of the Samurai', duration:116, genre:'Crime', trailer:'https://www.youtube.com/watch?v=uLHeMzjQ29E', slug:'ghost-dog-the-way-of-the-samurai'}
  ];

  var monthNames = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  var dayNames = {wed: 'Wednesday', sun: 'Sunday'};

  function monthKey(dateStr) { return dateStr.slice(0, 7); }

  var months = [];
  films.forEach(function(f) {
    var k = monthKey(f.date);
    if (months.indexOf(k) === -1) months.push(k);
  });
  months.sort();

  var currentIndex = 0;

  function fmtRuntime(mins) {
    var h = Math.floor(mins / 60), m = mins % 60;
    if (h && m) return h + 'h ' + m + 'm';
    if (h) return h + 'h';
    return m + 'm';
  }

  function dayNum(dateStr) { return parseInt(dateStr.slice(8, 10), 10); }

  function render() {
    var key = months[currentIndex];
    var monthIdx = parseInt(key.slice(5, 7), 10) - 1;
    document.getElementById('monthLabel').textContent = monthNames[monthIdx];
    document.getElementById('prevMonth').disabled = currentIndex === 0;
    document.getElementById('nextMonth').disabled = currentIndex === months.length - 1;

    var monthFilms = films.filter(function(f) { return monthKey(f.date) === key; });
    var list = document.getElementById('filmList');

    if (monthFilms.length === 0) {
      list.innerHTML = '<p class="empty-month">No screenings scheduled yet.</p>';
      return;
    }

    list.innerHTML = monthFilms.map(function(f) {
      return '' +
        '<div class="screening">' +
          '<div class="poster"><img src="assets/posters/' + f.slug + '.jpg" alt="' + f.title + ' poster" loading="lazy"></div>' +
          '<p class="day-tag ' + f.day + '">' + dayNames[f.day] + ' <span class="day-num">' + dayNum(f.date) + '</span></p>' +
          '<p class="film-title">' + f.title + '</p>' +
          '<p class="film-meta">' + f.genre + (f.vo ? ' · VO' : '') + ' · ' + fmtRuntime(f.duration) + '</p>' +
          '<a class="trailer-link" href="' + f.trailer + '" target="_blank" rel="noopener">Watch trailer</a>' +
        '</div>';
    }).join('');

    triggerPopcorn();
  }

  var puffImages = ['assets/popcorn/popcorn-1.png', 'assets/popcorn/popcorn-2.png', 'assets/popcorn/popcorn-3.png'];
  var popcornTimer = null;

  function triggerPopcorn() {
    var old = document.getElementById('popcornIntro');
    if (old && old.parentNode) old.parentNode.removeChild(old);
    if (popcornTimer) clearTimeout(popcornTimer);

    var intro = document.createElement('div');
    intro.className = 'popcorn-intro';
    intro.id = 'popcornIntro';
    document.body.insertBefore(intro, document.body.firstChild);

    var count = 14;
    for (var i = 0; i < count; i++) {
      var piece = document.createElement('div');
      piece.className = 'popcorn-piece';
      var img = puffImages[Math.floor(Math.random() * puffImages.length)];
      piece.innerHTML = '<img src="' + img + '" alt="" draggable="false">';
      var left = Math.random() * 96;
      var scale = 0.6 + Math.random() * 0.8;
      var duration = 1.1 + Math.random() * 0.7;
      var delay = Math.random() * 0.5;
      piece.style.left = left + 'vw';
      piece.style.transform = 'scale(' + scale.toFixed(2) + ')';
      piece.style.animationDuration = duration.toFixed(2) + 's';
      piece.style.animationDelay = delay.toFixed(2) + 's';
      intro.appendChild(piece);
    }

    popcornTimer = setTimeout(function() {
      if (intro && intro.parentNode) intro.parentNode.removeChild(intro);
    }, 2200);
  }

  document.getElementById('prevMonth').addEventListener('click', function() {
    if (currentIndex > 0) { currentIndex--; render(); }
  });
  document.getElementById('nextMonth').addEventListener('click', function() {
    if (currentIndex < months.length - 1) { currentIndex++; render(); }
  });

  render();
</script>

</body>
</html>
